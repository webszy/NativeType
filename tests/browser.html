<!doctype html>
<meta charset="utf-8">
<title>NativeType local regression fixture</title>
<style>
body { font:16px system-ui; max-width:640px; margin:40px auto; background:white; color:#111; }
[contenteditable] { border:1px solid #aaa; min-height:60px; padding:16px; margin-bottom:170px; white-space:pre-wrap; }
button { padding:8px 16px; } pre { white-space:pre-wrap; }
</style>
<h1>NativeType local regression fixture</h1>
<p>This fixture uses a fake Translator for deterministic tests. It does not verify Chrome’s real model or X’s React editor.</p>
<button id="run">Run regression tests</button>
<pre id="results">Ready</pre>
<div contenteditable="true" role="textbox" data-testid="tweetTextarea_0" aria-label="New post"></div>
<div role="dialog" aria-label="Reply dialog" style="transform:translate(0);background:rgb(20,20,20);color:white;overflow:hidden;margin-bottom:170px"><div data-testid="tweetTextarea_1RichTextInputContainer" style="margin-bottom:0"><div contenteditable="true" role="textbox" data-testid="tweetTextarea_1" aria-label="Reply" style="background:rgba(255,255,255,0);margin-bottom:0"></div></div><div role="toolbar" aria-label="Reply actions"><button>Reply</button></div></div>
<script type="module">
let calls = [], creates = 0, delay = 15;
window.Translator = {
  availability: async () => 'downloadable',
  create: async ({ monitor }) => {
    creates++;
    monitor({ addEventListener: (_, listener) => listener({ loaded: .5 }) });
    return { translate: async text => {
      calls.push(text);
      await new Promise(resolve => setTimeout(resolve, delay));
      return text.includes('多行') ? 'First line\nSecond line' : `English: ${text.replace(/\p{Script=Han}/gu, 'word')}`;
    }, destroy() {} };
  },
};
// This page is not x.com, so the content-script entry correctly declines it.
// Start the same X adapter, provider, and language pair the entry uses there.
const { startNativeType } = await import('../core/controller.ts');
const { createOverlay } = await import('../ui/overlay.ts');
const { defaultLanguagePair } = await import('../languages/config.ts');
const { xPlatform } = await import('../platforms/x.ts');
const { getTranslationProvider } = await import('../translators/registry.ts');
const invalidation = new AbortController();
startNativeType({
  platform: xPlatform,
  provider: getTranslationProvider('chrome'),
  languagePair: defaultLanguagePair,
  host: {
    listen: (target, type, listener) => target.addEventListener(type, listener, { signal: invalidation.signal }),
    onInvalidated(callback) { invalidation.signal.addEventListener('abort', callback); },
  },
});
const invalidate = () => invalidation.abort();
const first = document.querySelector('[data-testid="tweetTextarea_0"]');
const second = document.querySelector('[data-testid="tweetTextarea_1"]');
// Minimal editor adapter: production X supplies its own Draft.js paste handler.
let handledPastes = 0;
let normalizedSelections = 0;
for (const editor of [first, second]) editor.addEventListener('mouseup', () => {
  const selection = getSelection();
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  if (!nodes.length || selection.toString() !== editor.innerText) return;
  const normalized = document.createRange();
  normalized.setStart(nodes[0], 0);
  normalized.setEnd(nodes.at(-1), nodes.at(-1).textContent.length);
  selection.removeAllRanges();
  selection.addRange(normalized);
  normalizedSelections++;
});
for (const editor of [first, second]) editor.addEventListener('paste', event => {
  event.preventDefault();
  handledPastes++;
  document.execCommand('insertText', false, event.clipboardData.getData('text/plain'));
});
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const root = () => document.querySelector('[data-nativetype]').shadowRoot;
const shown = () => getComputedStyle(document.querySelector('[data-nativetype]')).display !== 'none';
const preview = () => root().querySelector('p').textContent;
const button = text => [...root().querySelectorAll('button')].find(el => el.textContent === text);
const input = (el, text) => { el.focus(); el.textContent = text; el.dispatchEvent(new InputEvent('input', { bubbles: true })); };
const results = document.querySelector('#results');
const assert = (condition, description) => { if (!condition) throw new Error(description); results.textContent += `\nPASS ${description}`; };
window.__nativetypeFixtureReady = true;
document.querySelector('#run').addEventListener('click', async () => {
  results.textContent = 'Running';
  try {
    const firstMinHeight = first.style.getPropertyValue('min-height');
    const firstMinHeightPriority = first.style.getPropertyPriority('min-height');
    const languageOverlay = createOverlay(() => {}, () => {}, () => ({ container: document.body }), { source: 'zh', target: 'ja' });
    languageOverlay.show(first, { kind: 'translated', text: 'こんにちは' });
    assert(languageOverlay.host.shadowRoot.querySelector('header').textContent === 'NativeType · Chinese → Japanese'
      && languageOverlay.host.shadowRoot.querySelector('p').lang === 'ja', 'Overlay label and text language follow the supplied language pair');
    languageOverlay.destroy();
    input(first, 'Hello'); await sleep(1100);
    assert(calls.length === 0 && !shown(), 'English text does not translate');
    input(first, '你好'); await sleep(400); input(first, '你好世界'); await sleep(650);
    assert(calls.length === 0 && !shown(), 'Debounce resets on continued input');
    await sleep(450);
    assert(shown() && button('Enable translation'), 'First use requests activation');
    button('Enable translation').click(); await sleep(80);
    assert(calls.length === 1 && shown() && button('Replace') && creates === 1, 'Translation preview appears');
    first.dispatchEvent(new InputEvent('input', { bubbles: true })); await sleep(1100);
    assert(calls.length === 1, 'Unchanged input is deduplicated');
    button('Retry').click(); await sleep(80);
    assert(calls.length === 2 && creates === 1, 'Retry translates again and reuses instance');
    const draftBeforeClose = first.innerText;
    delay = 120;
    button('Retry').click(); await sleep(20);
    root().querySelector('button[aria-label="Close translation preview"]').click(); await sleep(180);
    assert(!shown() && !document.querySelector('[data-nativetype]').matches(':popover-open') && first.innerText === draftBeforeClose, 'Close preserves the draft and pending translation cannot reopen the preview');
    assert(first.style.getPropertyValue('min-height') === firstMinHeight && first.style.getPropertyPriority('min-height') === firstMinHeightPriority, 'Close restores the input height and original style priority');
    delay = 15;
    input(first, '你好世界！'); await sleep(1100);
    assert(shown() && button('Replace'), 'Editing after close shows the next translation preview');
    const pastesBefore = handledPastes;
    const english = preview(); button('Replace').click(); await sleep(150);
    assert(first.innerText === english && handledPastes === pastesBefore + 1 && !shown(), 'Replace delegates text insertion to the editor paste handler');
    assert(normalizedSelections > 0, 'Equivalent text-node selection boundaries are accepted');
    document.execCommand('insertText', false, '!'); await sleep(80);
    assert(first.innerText === english + '!', 'Caret remains editable after replacement');
    input(first, '多行'); await sleep(1100); button('Replace').click(); await sleep(150);
    assert(first.innerText === 'First line\nSecond line', 'Multiline replacement retains paragraph breaks');
    input(first, ''); await sleep(1100);
    const beforeIME = calls.length;
    first.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
    input(first, '输入中'); await sleep(1100);
    assert(calls.length === beforeIME, 'IME composition suppresses translation');
    first.dispatchEvent(new CompositionEvent('compositionend', { bubbles: true })); await sleep(1100);
    assert(calls.length === beforeIME + 1 && shown(), 'IME commit schedules translation');
    delay = 1400;
    input(first, '旧'); await sleep(1100);
    input(first, '新'); await sleep(1100); await sleep(400);
    assert(!preview().includes('English:'), 'Stale completed result cannot overwrite current loading state');
    await sleep(1000);
    assert(shown() && preview() === 'English: word', 'Newest request wins');
    delay = 15;
    const heightTarget = second.parentElement;
    const originalMinHeight = heightTarget.style.getPropertyValue('min-height');
    const originalMinHeightPriority = heightTarget.style.getPropertyPriority('min-height');
    const dialogHeightBefore = second.closest('[role="dialog"]').getBoundingClientRect().height;
    const toolbarTopBefore = document.querySelector('[aria-label="Reply actions"]').getBoundingClientRect().top - second.closest('[role="dialog"]').getBoundingClientRect().top;
    input(second, '回复'); await sleep(1100);
    assert(first.style.getPropertyValue('min-height') === firstMinHeight, 'Switching composers restores the previous input height');
    assert(document.querySelector('[data-nativetype]').parentElement.getAttribute('role') === 'dialog', 'Preview stays inside modal focus boundary');
    const host = document.querySelector('[data-nativetype]');
    const previewRect = host.getBoundingClientRect();
    const textRange = document.createRange();
    textRange.selectNodeContents(second.firstChild);
    const textRects = [...textRange.getClientRects()];
    const firstLine = textRects[0];
    const textBottom = Math.max(...textRects.map(rect => rect.bottom));
    const expectedLeft = Math.max(8, Math.min(firstLine.left + parseFloat(getComputedStyle(second).fontSize) * 2, innerWidth - previewRect.width - 8));
    assert(Math.abs(previewRect.left - expectedLeft) < 1 && Math.abs(previewRect.top - textBottom - 4) < 1, 'Floating preview stays four pixels below the text with a two-character indent');
    assert(getComputedStyle(root().querySelector('section')).backgroundColor === 'rgb(20, 20, 20)', 'Transparent white composer inherits the dark dialog theme');
    const dialogRect = second.closest('[role="dialog"]').getBoundingClientRect();
    assert(host.matches(':popover-open') && getComputedStyle(host).position === 'fixed', 'Preview floats in the top layer outside dialog clipping');
    assert(dialogRect.height > dialogHeightBefore && document.querySelector('[aria-label="Reply actions"]').getBoundingClientRect().top - dialogRect.top > toolbarTopBefore && previewRect.bottom + 11 <= heightTarget.getBoundingClientRect().bottom, 'Preview expands the input area and moves the toolbar below the card');
    const singleLineHeight = heightTarget.getBoundingClientRect().height;
    const callsBeforeLineBreak = calls.length;
    input(second, '回复\n第二行\n第三行'); await sleep(80);
    textRange.selectNodeContents(second.firstChild);
    const multilineBottom = Math.max(...[...textRange.getClientRects()].map(rect => rect.bottom));
    assert(shown() && Math.abs(host.getBoundingClientRect().top - multilineBottom - 4) < 1 && calls.length === callsBeforeLineBreak && button('Replace').hidden, 'Line breaks move the pending preview immediately without waiting for translation or offering stale replacement');
    await sleep(1100);
    assert(host.getBoundingClientRect().bottom + 11 <= heightTarget.getBoundingClientRect().bottom && heightTarget.getBoundingClientRect().height > singleLineHeight, 'Multiple text lines and the preview fit inside the expanded input area');
    input(second, '自动换行文字'.repeat(30)); await sleep(80);
    textRange.selectNodeContents(second.firstChild);
    const wrappedLines = [...textRange.getClientRects()].filter(rect => rect.width > 0 && rect.height > 0);
    assert(wrappedLines.length > 1 && Math.abs(host.getBoundingClientRect().top - Math.max(...wrappedLines.map(rect => rect.bottom)) - 4) < 1, 'Automatic wrapping also keeps the preview below the last rendered line');
    input(second, '回复\n第二行\n第三行'); await sleep(1100);
    button('Replace').click(); await sleep(150);
    assert(first.innerText === '新' && second.innerText.startsWith('English:'), 'Only the active composer is replaced');
    assert(!host.matches(':popover-open') && second.parentElement.style.marginBottom === '0px' && second.style.marginBottom === '0px', 'Hiding preview restores the original container spacing');
    assert(heightTarget.style.getPropertyValue('min-height') === originalMinHeight && heightTarget.style.getPropertyPriority('min-height') === originalMinHeightPriority, 'Replace restores the input height and original style priority');
    const inactiveCalls = calls.length;
    first.textContent = '后台中文';
    first.dispatchEvent(new InputEvent('input', { bubbles: true }));
    await sleep(1100);
    assert(calls.length === inactiveCalls, 'Inactive composer edits do not start translation');
    input(second, '删除测试'); await sleep(1100); second.closest('[role="dialog"]').remove(); await sleep(80);
    assert(!document.querySelector('[data-nativetype]') || !shown(), 'Removing active composer dialog cleans preview');
    assert(heightTarget.style.getPropertyValue('min-height') === originalMinHeight, 'Removing the composer also clears the temporary input height');
    const quote = document.createElement('div');
    quote.contentEditable = 'true';
    quote.setAttribute('role', 'textbox');
    quote.setAttribute('data-testid', 'tweetTextarea_quote');
    quote.setAttribute('aria-label', 'Quote');
    document.body.append(quote);
    const quoteCalls = calls.length;
    input(quote, '引用'); await sleep(1100);
    assert(calls.length === quoteCalls + 1 && shown() && preview().includes('word'), 'Quote composer is recognized by the X selector');
    quote.remove(); await sleep(80);
    assert(!shown(), 'Removing the active quote composer cleans the preview');
    const beforeInvalidate = calls.length;
    invalidate();
    input(first, '失效后'); await sleep(1100);
    assert(!document.querySelector('[data-nativetype]') && calls.length === beforeInvalidate, 'Invalidation destroys the preview and stops translation');
    results.textContent += '\nDONE: All local regression checks passed.';
  } catch (error) { results.textContent += `\nFAIL ${error.message}`; }
});
</script>
